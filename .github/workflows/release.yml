name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --clean --onefile --console --name PDownloader --collect-all yt_dlp main.py

      - name: Verify build
        run: |
          dir dist

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PDownloader.exe -DestinationPath PDownloader-${{ github.ref_name }}-Windows.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDownloader-${{ github.ref_name }}
          path: PDownloader-${{ github.ref_name }}-Windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PDownloader-${{ github.ref_name }}-Windows.zip
