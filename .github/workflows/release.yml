name: Build Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --onefile `
            --console `
            --name PDownloader `
            --collect-all yt_dlp `
            main.py

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/PDownloader.exe `
            -DestinationPath PDownloader-${{ github.ref_name }}-Windows.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDownloader-${{ github.ref_name }}-Windows
          path: PDownloader-${{ github.ref_name }}-Windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PDownloader-${{ github.ref_name }}-Windows.zip

  linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller \
            --clean \
            --onedir \
            --console \
            --name PDownloader \
            --collect-all yt_dlp \
            main.py

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../PDownloader-${{ github.ref_name }}-Linux.zip PDownloader

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDownloader-${{ github.ref_name }}-Linux
          path: PDownloader-${{ github.ref_name }}-Linux.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PDownloader-${{ github.ref_name }}-Linux.zip