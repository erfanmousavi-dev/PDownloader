name: Build Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --onefile `
            --console `
            --name PDownloader `
            --collect-all yt_dlp `
            main.py

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive dist/PDownloader.exe PDownloader-${{ github.ref_name }}-Windows.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: PDownloader-${{ github.ref_name }}-Windows.zip

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller \
            --clean \
            --onedir \
            --console \
            --name PDownloader \
            --collect-all yt_dlp \
            main.py

      - name: Zip
        run: |
          cd dist
          zip -r ../PDownloader-${{ github.ref_name }}-Linux.zip PDownloader

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: PDownloader-${{ github.ref_name }}-Linux.zip

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller \
            --clean \
            --onedir \
            --console \
            --name PDownloader \
            --collect-all yt_dlp \
            main.py

      - name: Zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent PDownloader.app ../PDownloader-${{ github.ref_name }}-macOS.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: PDownloader-${{ github.ref_name }}-macOS.zip